# slm-fa: the Persian-first configuration used for the shipped checkpoint.
#
# Trained on REAL data (Persian Wikipedia + Python + English + mined
# docstring->code bridge pairs), 250M tokens available, memory mapped.
#
# Architecture notes
#   * ctx 512 because code needs it (a function is 100-300 tokens)
#   * GQA 8:2 -> the KV cache is 4x smaller, which is what makes long context
#     affordable on a small machine
#   * QK-norm + z-loss: the two cheapest fixes for loss spikes in long runs
#   * progressive growth: the run starts at 6 blocks and grows to 8, so early
#     steps are cheap and the parameter count visibly increases while training

model.arch_version     = 2
model.n_layer          = 6          # grows to 8 (see train.grow)
model.n_head           = 8
model.n_kv_head        = 2
model.n_embd           = 384
model.block_size       = 512
model.norm             = rms
model.pos              = rope
model.rope_theta       = 10000
model.ffn              = swiglu
model.linear_bias      = false
model.qk_norm          = true
model.tie_weights      = true
model.grad_checkpointing = false    # turn on when memory is tight

train.lr               = 1.5e-3
train.weight_decay     = 0.1
train.grad_clip        = 1.0
train.schedule         = wsd        # warmup-stable-decay: resumable at any point
train.decay_frac       = 0.15
train.zloss            = 1e-4       # OLMo/PaLM softmax stabiliser
train.skip_spike       = 4.0        # skip a batch whose grad norm is 4x the EMA
train.grow             = 600:1,1200:1

# --------------------------------------------------------------- self training
continual.lr             = 1.5e-5
continual.local_steps    = 2
continual.batch          = 2
continual.ctx            = 512
continual.min_interval_s = 8
continual.replay_percent = 50
continual.last_k_blocks  = 2
continual.train_embeddings = false

selfgen.lr             = 8e-6
selfgen.local_steps    = 1
selfgen.batch          = 2
selfgen.ctx            = 512
selfgen.min_interval_s = 15
selfgen.replay_percent = 60
selfgen.last_k_blocks  = 2
selfgen.samples_per_round = 6
selfgen.max_new_tokens = 96
selfgen.balance_languages = true
selfgen.ppl_min        = 1.000001
selfgen.ppl_max        = 40.0
selfgen.ppl_min_ratio  = 0.30
selfgen.ppl_max_ratio  = 3.0
selfgen.max_repeat_ratio = 0.34
selfgen.max_code_switch = 0.25
selfgen.require_valid_python = true
selfgen.keep_best      = 3
selfgen.require_novel  = true

feedback.lr            = 2e-5
feedback.local_steps   = 2
feedback.batch         = 1
feedback.ctx            = 512
feedback.min_interval_s = 10
feedback.last_k_blocks = 2
feedback.dpo_beta      = 0.1
feedback.sft_weight    = 0.25
feedback.replay_weight = 0.5
feedback.balance_languages = true

# -------------------------------------------------------------- coordinator
coord.fisher           = true
coord.fisher_lambda    = 4.0
coord.ties             = true
coord.ties_keep        = 0.30
coord.pcgrad           = true
coord.trust_ratio      = 0.012
coord.global_trust_ratio = 0.018
coord.per_language_gate = true
coord.accept_tolerance = 0.003
coord.regression_budget = 0.01
coord.entropy_floor_ratio = 0.75
coord.rate_per_minute  = 0.05
coord.holdout_batch    = 2
coord.holdout_batches  = 2
coord.holdout_ctx      = 512
coord.merge_window_s   = 6
coord.save_every_rounds = 5

# ------------------------------------------------------------------- memory
memory.file            = runs/memory.jsonl
memory.top_k           = 3

chat.max_new_tokens    = 128
chat.temperature       = 0.8
chat.top_k             = 40
chat.top_p             = 0.95
autopilot.period_s     = 6
