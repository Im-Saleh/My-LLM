# slm-demo: the configuration of the bundled trilingual demo checkpoint
#           (Persian + English + Python, ~7.3M parameters).
#
# Architecture: the modern stack (RMSNorm + RoPE + SwiGLU + grouped-query
# attention).  Compared to the GPT-2 style stack at the same parameter count it
# trains more stably, has no learned position table (so the context can be
# extended later) and its KV cache is 4x smaller thanks to GQA.

model.arch_version     = 2
model.n_layer          = 6
model.n_head           = 8
model.n_kv_head        = 2          # GQA: 8 query heads share 2 kv heads
model.n_embd           = 320
model.block_size       = 256        # code needs more context than prose
model.norm             = rms
model.pos              = rope
model.rope_theta       = 10000
model.ffn              = swiglu
model.linear_bias      = false
model.tie_weights      = true
model.grad_checkpointing = true

train.lr               = 1.2e-3
train.weight_decay     = 0.1
train.grad_clip        = 1.0

# --------------------------------------------------------------- (a) continual
continual.lr             = 2e-5     # ~60x below pre-training
continual.local_steps    = 2
continual.batch          = 2
continual.ctx            = 256
continual.min_interval_s = 6
continual.replay_percent = 50       # half of every round is corpus replay
continual.last_k_blocks  = 2        # freeze everything below
continual.train_embeddings = false
continual.min_samples    = 2
continual.max_wait_s     = 25

# ----------------------------------------------------------------- (b) selfgen
selfgen.lr             = 1e-5
selfgen.local_steps    = 1
selfgen.batch          = 2
selfgen.ctx            = 256
selfgen.min_interval_s = 12
selfgen.replay_percent = 60
selfgen.last_k_blocks  = 2
selfgen.samples_per_round = 6
selfgen.max_new_tokens = 64
selfgen.temperature    = 0.95
selfgen.balance_languages = true    # generate for fa, en and py every round
selfgen.ppl_min        = 1.000001  # absolute backstop only
selfgen.ppl_max        = 30.0
selfgen.ppl_min_ratio  = 0.30       # band relative to the current holdout ppl
selfgen.ppl_max_ratio  = 3.0
selfgen.max_repeat_ratio = 0.34
selfgen.max_code_switch = 0.25      # fa/en: reject language interference
selfgen.require_valid_python = true # py: must pass the structural check
selfgen.py_min_comment_ratio = 0.0
selfgen.min_tokens     = 8
selfgen.keep_best      = 3
selfgen.require_novel  = true
selfgen.buffer_cap     = 192

# ---------------------------------------------------------------- (c) feedback
feedback.lr            = 3e-5
feedback.local_steps   = 2
feedback.batch         = 1
feedback.ctx           = 256
feedback.min_interval_s = 8
feedback.last_k_blocks = 2
feedback.dpo_beta      = 0.1
feedback.sft_weight    = 0.25
feedback.replay_weight = 0.5        # every round replays *all* languages
feedback.balance_languages = true   # no language may fill a whole round
feedback.good_score    = 3.5
feedback.min_score_gap = 0.5
feedback.max_pairs_per_round = 4

# -------------------------------------------------------------- coordinator
coord.fisher           = true
coord.fisher_lambda    = 4.0
coord.fisher_refresh_rounds = 6
coord.ties             = true
coord.ties_keep        = 0.30
coord.pcgrad           = true
coord.trust_ratio      = 0.015
coord.global_trust_ratio = 0.02
coord.priority.continual = 1.0
coord.priority.selfgen   = 0.6
coord.priority.feedback  = 1.4
coord.per_language_gate = true      # every language must pass its own gate
coord.accept_tolerance = 0.003
coord.regression_budget = 0.01
coord.entropy_floor_ratio = 0.75
coord.anchor_drift_max = 0.12
coord.anchor_ema       = 0.05
coord.rate_per_minute  = 0.06
coord.rate_burst       = 0.12
coord.holdout_batch    = 4
coord.holdout_batches  = 2
coord.merge_window_s   = 4
coord.round_period_s   = 0.25
coord.save_every_rounds = 5
coord.max_disk_backups = 6

chat.max_new_tokens    = 96
chat.temperature       = 0.8
chat.top_k             = 40
chat.top_p             = 0.95
autopilot.period_s     = 5
