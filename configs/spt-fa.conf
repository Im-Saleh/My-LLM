# SPT - Persian phase (phase 2 of the shipped model's training).
#
# Phase 1 (configs/spt-30m.conf) trained the 32.4M model on a five-way mixture
# and ran its WSD schedule to completion at step 1345.  This file is phase 2:
# the same weights, continued almost entirely on Persian.
#
# Why the mixture is not literally 100% Persian
#   A model trained on one distribution after being trained on five does not
#   just get better at the one - it *forgets* the others, fast, and the
#   forgetting shows up inside Persian too (numbers, code identifiers and Latin
#   proper nouns all appear in Persian text).  So 5% arithmetic and 5% Persian-
#   English parallel text ride along purely as replay.  95% of the tokens are
#   Persian, and the replay is what keeps the Persian itself from degrading.
#
# Why the learning rate restarts low
#   Phase 1 annealed to ~0.  Restarting at the original 1.2e-3 would throw away
#   most of what the anneal bought (a large LR on converged weights is a reset
#   in slow motion).  4e-4 is one third of the phase-1 peak: enough to move,
#   small enough to keep the basin.  WSD then decays it to ~0 again, so the
#   checkpoint at the end of the phase is a properly annealed one - not a
#   snapshot taken mid-flight.
#
# Resuming this phase is `--resume`, never a fresh start: the step counter, the
# optimiser moments and the token counter all continue.

model.arch_version     = 2
model.n_layer          = 10         # phase 1 grew 8 -> 10; no more growth here
model.n_head           = 8
model.n_kv_head        = 2
model.n_embd           = 512
model.block_size       = 512
model.norm             = rms
model.pos              = rope
model.rope_theta       = 10000
model.ffn              = swiglu
model.linear_bias      = false
model.qk_norm          = true
model.tie_weights      = true
model.grad_checkpointing = false

train.lr               = 4.0e-4     # 1/3 of the phase-1 peak, re-warmed
train.weight_decay     = 0.1
train.grad_clip        = 1.0
train.schedule         = wsd
train.decay_frac       = 0.15
train.zloss            = 1e-4
train.skip_spike       = 4.0
train.grow             =            # deliberately empty

# Self-training stays off by default here too - see configs/spt-30m.conf for the
# reasoning and for every coordinator knob, which this phase does not change.
train.enabled          = false

continual.lr             = 1.2e-5
continual.local_steps    = 2
continual.batch          = 2
continual.ctx            = 512
continual.min_interval_s = 8
continual.replay_percent = 55
continual.last_k_blocks  = 2
continual.train_embeddings = false

selfgen.lr             = 6e-6
selfgen.local_steps    = 1
selfgen.batch          = 2
selfgen.ctx            = 512
selfgen.min_interval_s = 15
selfgen.replay_percent = 60
selfgen.last_k_blocks  = 2
selfgen.samples_per_round = 6
selfgen.max_new_tokens = 96
selfgen.balance_languages = true
selfgen.ppl_min        = 1.000001
selfgen.ppl_max        = 40.0
selfgen.ppl_min_ratio  = 0.30
selfgen.ppl_max_ratio  = 3.0
selfgen.max_repeat_ratio = 0.34
selfgen.max_code_switch = 0.25
selfgen.require_valid_python = true
selfgen.keep_best      = 3
selfgen.require_novel  = true

feedback.lr            = 1.8e-5
feedback.local_steps   = 2
feedback.batch         = 1
feedback.ctx           = 512
feedback.min_interval_s = 10
feedback.last_k_blocks = 2
feedback.dpo_beta      = 0.1
feedback.sft_weight    = 0.25
feedback.replay_weight = 0.5
feedback.balance_languages = true

coord.fisher           = true
coord.fisher_lambda    = 4.0
coord.ties             = true
coord.ties_keep        = 0.30
coord.pcgrad           = true
coord.trust_ratio      = 0.012
coord.global_trust_ratio = 0.018
coord.per_language_gate = true
coord.accept_tolerance = 0.003
coord.regression_budget = 0.01
coord.entropy_floor_ratio = 0.75
coord.rate_per_minute  = 0.05
coord.holdout_batch    = 2
coord.holdout_batches  = 2
coord.holdout_ctx      = 512
coord.merge_window_s   = 6
coord.save_every_rounds = 5

memory.top_k           = 3

gguf.ctx               = 4096
gguf.kv_q8             = true
gguf.gpu_layers        = 0

chat.max_new_tokens    = 256
chat.temperature       = 0.75
chat.top_k             = 40
chat.top_p             = 0.95
chat.min_p             = 0.05
autopilot.period_s     = 6
