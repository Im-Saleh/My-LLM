# SPT-30M: the shipped model.  Persian first, mathematical reasoning second.
#
# Target: 32.4M parameters, trained on a Persian-heavy mixture with a large
# worked-arithmetic component.  This is the configuration the shipped
# models/spt.slm was produced with, so continuing to train it is `--resume`, not
# a migration.
#
# Why these numbers
#   * dim 512 / 10 layers: at ~32M parameters this depth/width ratio is close to
#     the compute-optimal shape, and depth is what carries multi-step arithmetic
#     (each layer is one more step the residual stream can compose).
#   * ctx 512: a worked division with carries is 60-120 tokens, a GSM8K solution
#     up to 250; 512 leaves room for a few-shot prefix.
#   * GQA 8:2 -> the KV cache is 4x smaller.  On a 2GB card that is the
#     difference between fitting and not.
#   * vocab 8192, and deliberately NOT retrained on the maths corpus: the
#     existing tokenizer splits digits into individual bytes, which is exactly
#     what you want for arithmetic.  A BPE that merges "1234" into one token
#     cannot learn carrying, because the carry happens between digits it can no
#     longer see.  (Every model that is good at arithmetic does digit-level
#     tokenisation for this reason.)
#   * progressive growth 8 -> 10 blocks: early steps run on a smaller model and
#     the parameter count visibly rises during training.

model.arch_version     = 2
model.n_layer          = 8          # grows to 10 (see train.grow)
model.n_head           = 8
model.n_kv_head        = 2
model.n_embd           = 512
model.block_size       = 512
model.norm             = rms
model.pos              = rope
model.rope_theta       = 10000
model.ffn              = swiglu
model.linear_bias      = false
model.qk_norm          = true
model.tie_weights      = true
model.grad_checkpointing = false

train.lr               = 1.2e-3
train.weight_decay     = 0.1
train.grad_clip        = 1.0
train.schedule         = wsd        # resumable at any point, unlike cosine
train.decay_frac       = 0.15
train.zloss            = 1e-4
train.skip_spike       = 4.0
train.grow              = 550:1,1100:1

# --------------------------------------------------------------- self training
# OFF BY DEFAULT.  The three threads only run when train.enabled = true (the
# switch in the Training view, or --set train.enabled=true).  A model that
# rewrites its own weights the moment you open the dashboard is not what someone
# installing a package expects.
train.enabled          = false

continual.lr             = 1.2e-5
continual.local_steps    = 2
continual.batch          = 2
continual.ctx            = 512
continual.min_interval_s = 8
continual.replay_percent = 55
continual.last_k_blocks  = 2
continual.train_embeddings = false

selfgen.lr             = 6e-6
selfgen.local_steps    = 1
selfgen.batch          = 2
selfgen.ctx            = 512
selfgen.min_interval_s = 15
selfgen.replay_percent = 60
selfgen.last_k_blocks  = 2
selfgen.samples_per_round = 6
selfgen.max_new_tokens = 96
selfgen.balance_languages = true
selfgen.ppl_min        = 1.000001
selfgen.ppl_max        = 40.0
selfgen.ppl_min_ratio  = 0.30
selfgen.ppl_max_ratio  = 3.0
selfgen.max_repeat_ratio = 0.34
selfgen.max_code_switch = 0.25
selfgen.require_valid_python = true
selfgen.keep_best      = 3
selfgen.require_novel  = true

feedback.lr            = 1.8e-5
feedback.local_steps   = 2
feedback.batch         = 1
feedback.ctx           = 512
feedback.min_interval_s = 10
feedback.last_k_blocks = 2
feedback.dpo_beta      = 0.1
feedback.sft_weight    = 0.25
feedback.replay_weight = 0.5
feedback.balance_languages = true

# -------------------------------------------------------------- coordinator
coord.fisher           = true
coord.fisher_lambda    = 4.0
coord.ties             = true
coord.ties_keep        = 0.30
coord.pcgrad           = true
coord.trust_ratio      = 0.012
coord.global_trust_ratio = 0.018
coord.per_language_gate = true
coord.accept_tolerance = 0.003
coord.regression_budget = 0.01
coord.entropy_floor_ratio = 0.75
coord.rate_per_minute  = 0.05
coord.holdout_batch    = 2
coord.holdout_batches  = 2
coord.holdout_ctx      = 512
coord.merge_window_s   = 6
coord.save_every_rounds = 5

# ------------------------------------------------------------------- memory
memory.top_k           = 3

# ------------------------------------------------------------------ the agent
# The ready-made second model.  `slm fetch-model olmo` downloads it here.
gguf.ctx               = 4096
gguf.kv_q8             = true
gguf.gpu_layers        = 0

chat.max_new_tokens    = 256
chat.temperature       = 0.75
chat.top_k             = 40
chat.top_p             = 0.95
chat.min_p             = 0.05
autopilot.period_s     = 6
