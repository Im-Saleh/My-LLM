# slm-tiny: smoke tests, CI and low-end laptops (~1M parameters)
# Trains from scratch on the bundled sample corpus in a couple of minutes.

model.n_layer          = 4
model.n_head           = 4
model.n_embd           = 128
model.block_size       = 128
model.tie_weights      = true
model.grad_checkpointing = false

train.lr               = 1.5e-3
train.weight_decay     = 0.1
train.grad_clip        = 1.0

# ---------------------------------------------------------------- self training
continual.lr           = 3e-5
continual.local_steps  = 2
continual.batch        = 2
continual.ctx          = 128
continual.min_interval_s = 4
continual.replay_percent = 50
continual.last_k_blocks = 2
continual.min_samples  = 2

selfgen.lr             = 1.5e-5
selfgen.local_steps    = 1
selfgen.batch          = 2
selfgen.ctx            = 128
selfgen.min_interval_s = 6
selfgen.replay_percent = 60
selfgen.last_k_blocks  = 2
selfgen.samples_per_round = 6
selfgen.keep_best      = 3

feedback.lr            = 4e-5
feedback.local_steps   = 2
feedback.batch         = 1
feedback.ctx           = 128
feedback.min_interval_s = 5
feedback.last_k_blocks = 2
feedback.dpo_beta      = 0.1
feedback.sft_weight    = 0.25

coord.holdout_batch    = 4
coord.holdout_batches  = 2
coord.merge_window_s   = 4
coord.accept_tolerance = 0.003
coord.regression_budget = 0.01

chat.max_new_tokens    = 48
chat.temperature       = 0.85
autopilot.period_s     = 4
