# slm-124m: the GPT-2-small shaped target (~124M parameters with a 32k vocab).
#
# Read this before using it - the numbers are the whole point of the file.
#
# Memory, per replica, with everything in fp32:
#   weights        124M * 4B  = 496 MiB
#   gradients      124M * 4B  = 496 MiB
#   AdamW state    124M * 8B  = 992 MiB
#   ------------------------------------------
#   full training              ~2.0 GiB  + activations
#
# That fits in 16 GiB of RAM but *not* in 2 GiB of VRAM.  What does fit in 2 GiB
# is exactly what the self-training threads do: train a *slice* of the model.
# With `last_k_blocks = 2` (plus the head and the final layernorm) only about
# 12-15M parameters are trainable, so:
#   frozen weights fp16        248 MiB
#   trainable grads fp32        60 MiB
#   AdamW state (trainable)    120 MiB
#   activations, ctx 512, micro-batch 1, gradient checkpointing ~250 MiB
#   ------------------------------------------
#   total                      ~0.7 GiB   -> comfortable on a 2 GiB GPU
#
# Pre-training 124M *from scratch* is a GPU job (or many CPU hours): at the
# ~58 GFLOP/s the bundled CPU backend reaches, one 124M step of 8x512 tokens
# takes ~50 s.  Use this config to *continue* training an existing checkpoint,
# and run `slm info --config configs/slm-124m.conf` to print the budget for your
# own numbers before you start.

model.arch_version     = 2
model.n_layer          = 12
model.n_head           = 12
model.n_kv_head        = 4          # GQA: 3x smaller KV cache
model.n_embd           = 768
model.block_size       = 512
model.norm             = rms
model.pos              = rope
model.rope_theta       = 10000
model.ffn              = swiglu
model.linear_bias      = false
model.tie_weights      = true
model.grad_checkpointing = true     # mandatory at this size

train.lr               = 2.5e-4
train.weight_decay     = 0.1
train.grad_clip        = 1.0

continual.lr             = 8e-6
continual.local_steps    = 1
continual.batch          = 1
continual.ctx            = 512
continual.min_interval_s = 20
continual.replay_percent = 50
continual.last_k_blocks  = 2
continual.train_embeddings = false

selfgen.lr             = 5e-6
selfgen.local_steps    = 1
selfgen.batch          = 1
selfgen.ctx            = 512
selfgen.min_interval_s = 45
selfgen.replay_percent = 60
selfgen.last_k_blocks  = 2
selfgen.samples_per_round = 4
selfgen.max_new_tokens = 96
selfgen.keep_best      = 2

feedback.lr            = 1e-5
feedback.local_steps   = 1
feedback.batch         = 1
feedback.ctx           = 512
feedback.min_interval_s = 30
feedback.last_k_blocks = 2
feedback.dpo_beta      = 0.1

coord.trust_ratio      = 0.008      # tighter: a big model needs smaller steps
coord.global_trust_ratio = 0.012
coord.rate_per_minute  = 0.03
coord.rate_burst       = 0.06
coord.holdout_batch    = 2
coord.holdout_batches  = 2
coord.merge_window_s   = 20
coord.fisher_refresh_rounds = 4
coord.save_every_rounds = 3

chat.max_new_tokens    = 128

coord.per_language_gate = true
selfgen.balance_languages = true
feedback.replay_weight  = 0.5
feedback.balance_languages = true
